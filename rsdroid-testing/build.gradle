plugins {
    id 'java-library'
    alias(libs.plugins.kotlin.jvm)
    id 'signing'
    alias(libs.plugins.gradle.maven.publish.plugin)
}

apply from: "$rootDir/build-rust.gradle"

dependencies {
    implementation libs.kotlin.stdlib.jdk8
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
    // Include the native resources as well as the classes in the isolated integration-test JVMs.
    systemProperty 'rsdroidTesting.testClasspath', sourceSets.test.runtimeClasspath.asPath
}

jar {
    mustRunAfter("buildRust")
    sourceSets {
        main {
            resources {
                srcDirs 'build/generated/jniLibs'
            }
        }
    }
    doLast {
        def jarFile = new JarFile(archiveFile.get().getAsFile())
        int libCount = jarFile.entries().toList().count { it.name.contains(".so") || it.name.contains(".dll") || it.name.contains(".dylib") }
        if (libCount == 0 || (System.getenv("ALL_ARCHS") == "1" && libCount != 3)) {
            throw new GradleException("Jar appears to be missing shared library!")
        }
    }
}

java.sourceCompatibility = JavaVersion.VERSION_11
java.targetCompatibility = JavaVersion.VERSION_11

mavenPublishing {
    publishToMavenCentral(true) // "true" means publish+release automatically+unattended
    signAllPublications()
}

compileKotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}
compileTestKotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

// JUnit 6 requires Java 17; the published library still targets Java 11.
compileTestJava {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
