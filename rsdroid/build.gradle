import com.vanniktech.maven.publish.KotlinJvm
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'java-library'
    alias(libs.plugins.kotlin.jvm)
    id 'signing'
    alias(libs.plugins.gradle.maven.publish.plugin)
}

def gitHead = { File repo ->
    providers.exec {
        commandLine "git", "-C", repo.absolutePath, "rev-parse", "HEAD"
    }.standardOutput.asText.map { it.trim() }
}

def generateBuildConfig = tasks.register("generateBuildConfig", GenerateBuildConfigTask) {
    ankiCommitHash = gitHead(new File(rootDir, "anki"))
    backendGitCommitHash = gitHead(rootDir)
    ankiDesktopVersion = providers.gradleProperty("VERSION_NAME").map { it.replaceFirst(/.*anki/, "") }
    cargoLock = rootProject.file("Cargo.lock")
    outputDir = layout.buildDirectory.dir("generated/source/buildConfig")
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}

sourceSets {
    main {
        kotlin.srcDir("build/generated/source/backend")
        kotlin.srcDir(generateBuildConfig.flatMap { it.outputDir })
        // protoc emits Java messages alongside the generated Kotlin API.
        java.srcDir("build/generated/source/backend")
    }
}

tasks.named('compileKotlin').configure { dependsOn(':buildRust', 'installGitHook') }
tasks.named('compileJava').configure { dependsOn(':buildRust') }
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn(':buildRust') }

test {
    useJUnit()
}

dependencies {
    // These types and annotations appear in the public API.
    api libs.protobuf.kotlin.lite
    api libs.kotlinx.serialization.json
    api libs.androidx.annotation

    implementation libs.slf4j.api

    testImplementation libs.junit4
    testImplementation project(path: ':rsdroid-testing')
}

// Install Git pre-commit hook for format-rust
tasks.register('installGitHook', Copy) {
    from new File(rootProject.rootDir, 'pre-commit')
    into { new File(rootProject.rootDir, '.git/hooks') }
    filePermissions {
        user {
            read = write = execute = true
        }
    }
}
// to run manually: `./gradlew installGitHook`

mavenPublishing {
    // Publish sources and an empty Javadoc JAR for the Kotlin/generated API.
    configure(new KotlinJvm())
    // Use https://central.sonatype.com/account with david-allison's GitHub login, not Google
    // the host should match rsdroid-testing
    publishToMavenCentral(true) // "true" means publish+release automatically+unattended
    signAllPublications()
}
